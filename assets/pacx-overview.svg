<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">PaCX-MAE training and inference</title>
<desc id="desc">During training, chest X-ray, ECG, and laboratory information support cross-modal distillation. At inference, the learned chest X-ray encoder needs only a chest X-ray for downstream predictions. This is a simplified architecture diagram, not a medical image.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#806c62"/></marker>
  <g id="xray" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="-31" y="-35" width="62" height="70" rx="5"/><path d="M0-22V20M-5-15C-18-22-24-8-22 8S-7 24-5 13ZM5-15C18-22 24-8 22 8S7 24 5 13Z"/></g>
</defs>
<rect width="900" height="470" fill="#fff"/>
<rect x="20" y="20" width="516" height="430" rx="8" fill="#f7f5f2"/>
<rect x="560" y="20" width="320" height="430" rx="8" fill="#f7f5f2"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#30211a">
  <text x="45" y="65" font-family="Georgia, serif" font-size="31">During training</text>
  <text x="585" y="65" font-family="Georgia, serif" font-size="31">At inference</text>
  <g fill="#fff" stroke="#d8cec8" stroke-width="1.5"><rect x="41" y="99" width="143" height="142" rx="6"/><rect x="207" y="99" width="143" height="142" rx="6"/><rect x="373" y="99" width="143" height="142" rx="6"/></g>
  <use href="#xray" transform="translate(112 150) scale(.8)" color="#4e3629"/>
  <g fill="none" stroke="#b80d15" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M232 151H251L260 133L271 174L281 115L294 161L304 151H326"/></g>
  <g fill="none" stroke="#4e3629" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M426 119H461M434 119V152L419 177Q416 184 424 184H465Q473 184 469 177L453 152V119M429 163H460"/><path d="M437 171H453"/></g>
  <text x="112" y="218" text-anchor="middle" font-size="21">Chest X-ray</text><text x="278" y="218" text-anchor="middle" font-size="22">ECG</text><text x="444" y="218" text-anchor="middle" font-size="22">Labs</text>
  <g fill="none" stroke="#806c62" stroke-width="2.4" marker-end="url(#arrow)"><path d="M112 242V269H278V297"/><path d="M278 242V297"/><path d="M444 242V269H278V297"/></g>
  <rect x="108" y="300" width="340" height="86" rx="6" fill="#4e3629"/>
  <text x="278" y="335" text-anchor="middle" font-size="26" fill="#fff">PaCX-MAE</text>
  <text x="278" y="365" text-anchor="middle" font-size="20" fill="#f1dfd1">Cross-modal distillation</text>
  <text x="278" y="421" text-anchor="middle" font-size="20" fill="#6f6763">Physiology informs the representation</text>
  <use href="#xray" transform="translate(720 125) scale(.65)" color="#4e3629"/>
  <text x="720" y="179" text-anchor="middle" font-size="22">Chest X-ray only</text>
  <path d="M720 191V222" fill="none" stroke="#806c62" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="596" y="228" width="248" height="64" rx="6" fill="#4e3629"/><text x="720" y="268" text-anchor="middle" font-size="24" fill="#fff">CXR encoder</text>
  <path d="M720 298V329" fill="none" stroke="#806c62" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="596" y="337" width="248" height="58" rx="6" fill="#fff" stroke="#d8cec8" stroke-width="1.5"/><text x="720" y="373" text-anchor="middle" font-size="22">Predict / segment</text>
  <text x="720" y="429" text-anchor="middle" font-size="20" fill="#6f6763">No ECG or labs required</text>
</g>
</svg>
